<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zine Maker</title>
<!-- Inline so a hosted copy needs no extra file, and browsers stop asking
     the origin root for a favicon.ico that is not there. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23ff4f6d'/%3E%3Crect x='3' y='3.5' width='10' height='9' fill='%23fff'/%3E%3Cpath d='M8 3.5v9' stroke='%23ff4f6d' stroke-width='.9'/%3E%3C/svg%3E">

<!-- Styles that paint panel content. Read verbatim at export time and injected
     into the SVG used for rasterising, so this block must stay self-contained. -->
<style id="page-css">
  .panel {
    position: relative;
    overflow: hidden;
    background: #ffffff;
    font-family: "Helvetica Neue", Arial, sans-serif;
    color: #111111;
    box-sizing: border-box;
  }
  .panel * { box-sizing: border-box; }
  .el { position: absolute; }
  .el > .body { width: 100%; height: 100%; }
  .el-text > .body {
    white-space: pre-wrap;
    overflow-wrap: break-word;
    height: auto;
    min-height: 1em;     /* an emptied text box must stay grabbable */
    margin: 0;
    outline: none;
  }
  .el-img > .body { display: block; object-fit: cover; }
  .el-qr > .body { display: block; }
  .f-bw     { filter: grayscale(1); }
  .f-copy   { filter: grayscale(1) contrast(240%) brightness(112%); }
  .f-ink    { filter: grayscale(1) contrast(600%) brightness(105%); }
  .f-invert { filter: grayscale(1) invert(1) contrast(150%); }
</style>

<style>
  :root {
    --bg: #15151b;
    --bg2: #1d1d25;
    --line: #2e2e3a;
    --fg: #e9e9f0;
    --dim: #9a9aae;
    --accent: #ff4f6d;
    --accent2: #5b8cff;
    --radius: 7px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  /* Mobile browsers shrink the visual viewport as the URL bar slides away, so
     prefer the dynamic unit where it exists and keep 100% as the fallback. */
  @supports (height: 100dvh) { html, body { height: 100dvh; } }
  body {
    background: var(--bg);
    touch-action: manipulation;          /* no double-tap zoom on the chrome */
    color: var(--fg);
    font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: grid;
    grid-template-rows: auto 1fr;
    grid-template-columns: 1fr 272px;
    grid-template-areas: "bar bar" "stage side";
    overflow: hidden;
  }

  /* ---------- top bar ---------- */
  .bar {
    grid-area: bar;
    display: flex; align-items: center; gap: 8px;
    padding: 8px 12px;
    background: var(--bg2);
    border-bottom: 1px solid var(--line);
    flex-wrap: wrap;
    /* A grid item's own min-width defaults to its content's, so without
       this its buttons could force the grid track wider than the window
       rather than wrapping or shrinking — and fitBar()'s own measurement
       depends on the bar staying pinned to the real available width. */
    min-width: 0;
  }
  .logo {
    font: 700 15px/1 "Courier New", monospace;
    padding: 5px 8px;
    background: var(--accent);
    color: #fff;
    border-radius: 4px;
    transform: rotate(-2deg);
  }
  #title {
    background: transparent; border: 1px solid transparent; color: var(--fg);
    font-family: inherit; font-size: 14px; font-weight: 600;
    padding: 6px 8px; border-radius: var(--radius);
    min-width: 130px; max-width: 200px;
  }
  #title:hover { border-color: var(--line); }
  #title:focus { border-color: var(--accent2); outline: none; background: #0f0f14; }
  .sep { width: 1px; align-self: stretch; background: var(--line); margin: 0 2px; }
  .spacer { flex: 1; }

  button, select, input[type="text"], input[type="number"] {
    font: inherit; color: var(--fg);
    background: #26262f; border: 1px solid var(--line);
    border-radius: var(--radius); padding: 6px 10px; cursor: pointer;
  }
  button:hover, select:hover { background: #32323e; border-color: #45455a; }
  button:active { transform: translateY(1px); }
  button:disabled { opacity: .38; cursor: default; transform: none; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.primary:hover { background: #ff6580; border-color: #ff6580; }
  button.ghost { background: transparent; }
  .icon { padding: 6px 9px; }
  .icon svg { display: block; width: 16px; height: 16px; }
  /* Text for a couple of icon buttons that only appears once they are parked
     in the mobile settings sheet, where an icon alone has no tooltip to lean
     on. Opposite default from .btn-label, which starts visible. */
  .mobile-label { display: none; }

  .split { position: relative; display: flex; }
  .split > .primary:first-child { border-top-right-radius: 0; border-bottom-right-radius: 0; }
  .split-arrow {
    border-top-left-radius: 0; border-bottom-left-radius: 0;
    border-left: 1px solid rgba(0, 0, 0, .25); padding: 6px 7px;
  }
  .menu {
    position: absolute; top: calc(100% + 6px); right: 0; z-index: 60;
    background: var(--bg2); border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: 0 8px 24px rgba(0, 0, 0, .4); padding: 4px; min-width: 130px;
  }
  .menu[hidden] { display: none; }
  .menu button {
    display: block; width: 100%; text-align: left; background: transparent;
    border: none; padding: 7px 10px; border-radius: 5px; color: var(--fg);
  }
  .menu button:hover { background: #32323e; }
  input[type="color"] {
    width: 32px; height: 28px; padding: 2px; border: 1px solid var(--line);
    border-radius: 5px; background: #26262f; cursor: pointer;
  }
  input[type="range"] { width: 100%; accent-color: var(--accent2); cursor: pointer; }
  label.f {
    display: block; font-size: 10px; color: var(--dim); margin-bottom: 5px;
    letter-spacing: .06em; text-transform: uppercase;
  }

  /* ---------- stage ---------- */
  .stage {
    grid-area: stage;
    position: relative;
    overflow: auto;
    display: flex; flex-direction: column; align-items: center;
    padding: 20px 20px 4px;
    background: radial-gradient(circle at 50% 0%, #21212c 0%, var(--bg) 62%);
  }
  .paper-wrap {
    margin: auto;
    display: flex; flex-direction: column; align-items: stretch; gap: 5px;
  }
  .sheet-box { position: relative; }
  .sheet {
    display: flex;
    /* Must be top left: .sheet-box is sized to the *scaled* sheet, so the
       scaled box has to start in its corner or the two drift apart. */
    transform-origin: top left;
    box-shadow: 0 10px 40px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.07);
  }
  .sheet > .panel { flex: none; }
  /* Where the fold falls, on a facing-pages spread. */
  .spine {
    position: absolute; top: 0; bottom: 0; left: 50%;
    border-left: 1px dashed rgba(0,0,0,.3);
    pointer-events: none; display: none;
  }
  .spine.on { display: block; }
  .sheet-labels { display: flex; }
  .sheet-labels span { flex: 1; display: flex; justify-content: center; cursor: pointer; }
  .sheet-labels i {
    font-style: normal; padding: 3px 12px; border-radius: 99px;
    font-size: 10px; letter-spacing: .07em; text-transform: uppercase;
    color: var(--dim); user-select: none;
  }
  .sheet-labels span:hover i { color: var(--fg); }
  .sheet-labels span.on i { color: #fff; background: var(--accent); }
  .drop-hint {
    position: absolute; inset: 0; display: none;
    place-items: center; pointer-events: none;
    background: rgba(91,140,255,.16);
    border: 2px dashed var(--accent2);
    font-weight: 600; letter-spacing: .04em;
  }
  .stage.dragging .drop-hint { display: grid; }

  /* ---------- printer margin ---------- */
  .chop { position: absolute; inset: 0; pointer-events: none; }
  .chop .band {
    position: absolute;
    background: repeating-linear-gradient(45deg,
      rgba(255,79,109,.26) 0 calc(3px * var(--iz)),
      rgba(255,79,109,.07) calc(3px * var(--iz)) calc(6px * var(--iz)));
  }
  .band-t { top: 0; left: 0; right: 0; border-bottom: calc(1px * var(--iz)) dashed rgba(255,79,109,.85); }
  .band-b { bottom: 0; left: 0; right: 0; border-top: calc(1px * var(--iz)) dashed rgba(255,79,109,.85); }
  .band-l { left: 0; top: 0; bottom: 0; border-right: calc(1px * var(--iz)) dashed rgba(255,79,109,.85); }
  .band-r { right: 0; top: 0; bottom: 0; border-left: calc(1px * var(--iz)) dashed rgba(255,79,109,.85); }

  /* ---------- selection chrome ---------- */
  /* A finger on an element drags the element; the browser must not claim the
     gesture for scrolling first. Bare panel keeps its default, so a drag on
     empty paper still scrolls the stage. */
  .sheet .el { touch-action: none; }
  .el.sel { outline: calc(1.5px * var(--iz)) solid var(--accent2); }
  .el .ui { display: none; }
  .el.sel .ui { display: block; }
  .el .h {
    position: absolute; width: 11px; height: 11px; margin: -6px 0 0 -6px;
    background: #fff; border: 1.5px solid var(--accent2); border-radius: 2px;
    transform: scale(var(--iz)); transform-origin: center;
  }
  .el .h.se { left: 100%; top: 100%; cursor: nwse-resize; }
  .el .h.e  { left: 100%; top: 50%;  cursor: ew-resize; }
  .el .h.rot {
    left: 50%; top: 0; margin-top: calc(-22px * var(--iz));
    border-radius: 50%; cursor: grab; background: var(--accent2);
  }
  .el .stem {
    position: absolute; left: 50%; top: 0;
    width: calc(1.5px * var(--iz)); height: calc(22px * var(--iz));
    margin-left: calc(-.75px * var(--iz)); margin-top: calc(-22px * var(--iz));
    background: var(--accent2);
  }
  .el.editing { outline-color: var(--accent); }
  .el.editing > .body { cursor: text; }

  /* ---------- panel strip ---------- */
  .strip {
    display: flex; gap: 7px; align-items: flex-end; flex-wrap: wrap;
    justify-content: center; padding: 14px 4px 6px;
  }
  .thumb {
    background: none; border: none; padding: 0; cursor: pointer;
    display: flex; flex-direction: column-reverse; align-items: center; gap: 4px;
  }
  .thumb .tp {
    position: relative; overflow: hidden; background: #fff;
    border-radius: 2px; box-shadow: 0 0 0 1px var(--line);
  }
  .thumb.on .tp { box-shadow: 0 0 0 2px var(--accent); }
  .thumb.facing .tp { box-shadow: 0 0 0 2px var(--accent2); }   /* the other half of the spread */
  .thumb.facing .tl { color: var(--fg); }
  .thumb .tl { font-size: 10px; color: var(--dim); letter-spacing: .04em; }
  .thumb.on .tl { color: var(--fg); }
  .thumb .tp > .panel { transform-origin: top left; pointer-events: none; }

  /* ---------- inspector ---------- */
  .side {
    grid-area: side; background: var(--bg2); border-left: 1px solid var(--line);
    overflow-y: auto; padding: 14px;
  }
  .side h2 {
    font-family: inherit; font-size: 10px; font-weight: 600; line-height: 1;
    letter-spacing: .12em; text-transform: uppercase;
    color: var(--dim); margin: 0 0 12px;
  }
  .grp { border-top: 1px solid var(--line); padding: 14px 0; }
  .grp:first-child { border-top: none; padding-top: 0; }
  .grp:last-child { padding-bottom: 0; }
  .side-section {
    font-family: inherit; font-size: 12px; font-weight: 700; letter-spacing: .04em;
    color: var(--fg); margin: 22px 0 2px; padding-top: 16px; border-top: 2px solid var(--line);
  }
  .side-section:first-child { margin-top: 0; padding-top: 0; border-top: none; }
  .side-section small {
    display: block; font-size: 10px; font-weight: 400; letter-spacing: .04em;
    text-transform: uppercase; color: var(--dim); margin-top: 3px;
  }
  .side-section + .grp { border-top: none; padding-top: 8px; }
  .row { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
  .row > * { min-width: 0; }
  .row .grow { flex: 1; }
  .row:last-child { margin-bottom: 0; }
  .col { flex: 1; }
  .seg { display: flex; }
  .seg button {
    border-radius: 0; flex: 1; padding: 6px 4px; border-left-width: 0; text-align: center;
  }
  .seg button:first-child { border-radius: var(--radius) 0 0 var(--radius); border-left-width: 1px; }
  .seg button:last-child { border-radius: 0 var(--radius) var(--radius) 0; }
  .seg button.on { background: var(--accent2); border-color: var(--accent2); color: #fff; }
  .num { width: 58px; text-align: right; }
  .hint { color: var(--dim); font-size: 11px; line-height: 1.6; }
  .hint kbd {
    background: #26262f; border: 1px solid var(--line); border-bottom-width: 2px;
    border-radius: 4px; padding: 0 4px; font: 11px/1.4 "Courier New", monospace;
  }
  /* layout templates */
  .tpl-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .tpl {
    background: #26262f; border: 1px solid var(--line); border-radius: 5px;
    padding: 4px; cursor: pointer; display: block;
  }
  .tpl:hover { border-color: var(--accent2); background: #32323e; }
  .tpl svg { display: block; width: 100%; height: auto; border-radius: 2px; }
  .tpl span {
    display: block; font-size: 9px; color: var(--dim); text-align: center;
    margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .tpl:hover span { color: var(--fg); }

  .meter { height: 4px; background: #26262f; border-radius: 2px; overflow: hidden; margin-top: 6px; }
  .meter i { display: block; height: 100%; background: var(--accent2); width: 0; }
  .meter.hot i { background: var(--accent); }
  .fold { width: 100%; height: auto; display: block; margin-bottom: 10px; }
  .fold text { font: 9px sans-serif; fill: var(--dim); }
  .fold rect { fill: none; stroke: var(--line); }
  .fold .cut { stroke: var(--accent); stroke-width: 2; }

  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    background: #000; border: 1px solid var(--line); color: #fff;
    padding: 9px 16px; border-radius: 99px; font-size: 12px;
    opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 50;
  }
  .toast.on { opacity: 1; }

  /* ---------- help ---------- */
  .help { color: var(--dim); font-size: 12px; line-height: 1.6; }
  .help[hidden], #inspector[hidden] { display: none; }
  .help-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
  .help-head h2 { margin: 0; }
  .help h3 {
    font-size: 11px; font-weight: 600; color: var(--fg); margin: 18px 0 6px;
    letter-spacing: .02em;
  }
  .help p { margin: 0 0 8px; }
  .help b { color: var(--fg); font-weight: 600; }
  .help kbd {
    background: #26262f; border: 1px solid var(--line); border-bottom-width: 2px;
    border-radius: 4px; padding: 0 4px; font: 11px/1.4 "Courier New", monospace;
  }
  button.ghost.on { background: #26262f; border-color: var(--accent2); color: #fff; }

  /* ---------- sidebar as a sheet ---------- */
  /* Hidden off the bottom until the toolbar asks for it; only the narrow
     layout below ever leaves it there. */
  .side-bar { display: none; }
  #panelBtn { display: none; }
  #panelBtn.hot { border-color: var(--accent2); color: #fff; }

  /* ---------- touch ---------- */
  /* Sized by the finger rather than the pointer, on any touch screen. */
  @media (pointer: coarse) {
    button, select, input[type="text"], input[type="number"] { padding: 9px 12px; }
    .icon { padding: 8px 10px; min-width: 38px; }
    .icon svg { width: 18px; height: 18px; }
    .menu button { padding: 10px 12px; }
    input[type="color"] { width: 40px; height: 34px; }
    input[type="range"] { height: 30px; }
    .num { width: 68px; }
    .sheet-labels i { padding: 6px 14px; font-size: 11px; }
    .thumb { padding: 2px; }
    /* Handles counter-scale, so these are screen pixels under the fingertip. */
    .el .h { width: 18px; height: 18px; margin: -9px 0 0 -9px; }
    .el .h.rot { margin-top: calc(-28px * var(--iz)); }
    .el .stem { height: calc(28px * var(--iz)); margin-top: calc(-28px * var(--iz)); }
  }

  /* ---------- small screens ---------- */
  /* Every control lives in the inspector, so it cannot simply disappear on a
     phone: it becomes a sheet that slides up over the stage. */
  @media (max-width: 860px) {
    body { grid-template-columns: 1fr; grid-template-areas: "bar" "stage"; }
    /* The stage is the scarce thing here, so the toolbar sheds everything it
       can — the logo, the dividers, the words on the buttons — and wraps the
       rest itself rather than being told where to break. */
    .bar {
      gap: calc(4px * var(--bar-scale, 1));
      padding: 7px 8px; padding-top: max(7px, env(safe-area-inset-top));
    }
    .logo, .sep { display: none; }
    .btn-label { display: none; }
    .icon { padding: calc(8px * var(--bar-scale, 1)); }
    .icon svg {
      width: calc(18px * var(--bar-scale, 1)); height: calc(18px * var(--bar-scale, 1));
    }
    /* A glyph button is otherwise as narrow as its glyph, nothing like a
       fingertip — scaled down together with everything else so the floor
       shrinks too, rather than fighting fitBar() on the narrowest phones. */
    .bar button { min-width: calc(36px * var(--bar-scale, 1)); }
    /* The two buttons still carrying text, sized the same way. fitBar() sets
       --bar-scale on .bar only when the row would not otherwise fit; the
       var() fallback keeps every rule above at its normal size until then. */
    #helpBtn, #exportPdf {
      padding: calc(9px * var(--bar-scale, 1)) calc(12px * var(--bar-scale, 1));
      font-size: calc(13px * var(--bar-scale, 1));
    }
    /* fitBar() forces one line while it measures, so the true overflow
       shows up in scrollWidth instead of being absorbed by a wrap — and
       flex-shrink has to go too, or the same overflow gets absorbed by
       squeezing the buttons instead, which would under-measure it.
       scrollWidth only reliably includes that overflow once the element
       is a scroll container, which overflow:visible (the normal state)
       is not. */
    .bar.measuring { flex-wrap: nowrap; overflow: hidden; }
    .bar.measuring > * { flex-shrink: 0; }
    .spacer { display: none; }
    #panelBtn { display: inline-block; }

    .stage { padding: 10px 10px 2px; }
    .strip {
      flex-wrap: nowrap; overflow-x: auto; overscroll-behavior-x: contain;
      justify-content: flex-start; gap: 6px; padding: 8px 2px 4px;
      scrollbar-width: none;
    }
    .strip::-webkit-scrollbar { display: none; }
    /* Auto margins centre the eight while they fit and collapse to nothing
       once they do not, which keeps the first one reachable when it scrolls. */
    .thumb { flex: none; }
    .thumb:first-child { margin-left: auto; }
    .thumb:last-child { margin-right: auto; }

    .side {
      position: fixed; z-index: 70; left: 0; right: 0; bottom: 0;
      max-height: min(62vh, 440px);
      border-left: none; border-top: 1px solid var(--line);
      border-radius: 14px 14px 0 0;
      box-shadow: 0 -14px 34px rgba(0, 0, 0, .5);
      padding: 0 14px calc(14px + env(safe-area-inset-bottom));
      overscroll-behavior: contain;
      visibility: hidden;
      transform: translateY(calc(100% + 40px));
      transition: transform .2s ease, visibility .2s;
    }
    body.side-open .side { visibility: visible; transform: none; }
    .side-bar {
      display: flex; justify-content: flex-end; align-items: center;
      position: sticky; top: 0; z-index: 1;
      background: var(--bg2); padding: 9px 0 8px; margin-bottom: 2px;
    }
    /* Sticky counts as positioned, so the grip centres on the bar itself. */
    .side-bar .grab {
      position: absolute; left: 50%; top: 50%; margin: -2px 0 0 -23px;
      width: 46px; height: 4px; border-radius: 2px; background: var(--line);
    }
    /* 16px or smaller, and iOS zooms the whole page in on focus. */
    input[type="text"], input[type="number"], select { font-size: 16px; }
    .toast { bottom: calc(18px + env(safe-area-inset-bottom)); }

    /* The title, paper size and file buttons: app.js parks the real toolbar
       elements in these slots (see MOBILE_SETTINGS), so this only has to
       size them to the row rather than style them from scratch. */
    #docSettings[hidden] { display: none; }
    #docSettings .grow input, #docSettings .grow select { width: 100%; }
    #docSettings .grow button {
      width: 100%; display: flex; align-items: center; justify-content: center;
      gap: 6px; padding: 9px 12px;
    }
    #docSettings .mobile-label { display: inline; }
  }
</style>
</head>
<body>

<div class="bar">
  <span class="logo">ZINE</span>
  <input id="title" type="text" value="untitled zine" spellcheck="false" aria-label="Zine title">
  <div class="sep"></div>
  <button id="addText" class="icon" title="Add text" aria-label="Add text">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3 4h10M8 4v9"/></svg>
  </button>
  <button id="addImage" class="icon" title="Add image" aria-label="Add image">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round">
      <rect x="2" y="3" width="12" height="10" rx="1.5"/>
      <circle cx="5.6" cy="6.4" r="1" fill="currentColor" stroke="none"/>
      <path d="M3 12.3l3.3-3.6a1 1 0 0 1 1.5.05L10 11l1.4-1.6a1 1 0 0 1 1.5 0l1.1 1.3"/>
    </svg>
  </button>
  <button id="addQr" class="icon" title="Add QR code" aria-label="Add QR code">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round">
      <rect x="1" y="1" width="5" height="5"/>
      <rect x="2.3" y="2.3" width="2.4" height="2.4" fill="currentColor" stroke="none"/>
      <rect x="10" y="1" width="5" height="5"/>
      <rect x="11.3" y="2.3" width="2.4" height="2.4" fill="currentColor" stroke="none"/>
      <rect x="1" y="10" width="5" height="5"/>
      <rect x="2.3" y="11.3" width="2.4" height="2.4" fill="currentColor" stroke="none"/>
      <rect x="8.7" y="1" width="2" height="2" fill="currentColor" stroke="none"/>
      <rect x="12.4" y="4.6" width="2" height="2" fill="currentColor" stroke="none"/>
      <rect x="8.7" y="8.7" width="2.2" height="2.2" fill="currentColor" stroke="none"/>
      <rect x="12.3" y="8.7" width="2.2" height="2.2" fill="currentColor" stroke="none"/>
      <rect x="8.7" y="12.3" width="2.2" height="2.2" fill="currentColor" stroke="none"/>
      <rect x="12.3" y="12.3" width="2.2" height="2.2" fill="currentColor" stroke="none"/>
    </svg>
  </button>
  <input id="file" type="file" accept="image/*" multiple hidden>
  <input id="zineFile" type="file" accept=".zine,application/json" hidden>
  <div class="sep"></div>
  <button id="undo" class="icon ghost" title="Undo (Ctrl+Z)">&#8630;</button>
  <button id="redo" class="icon ghost" title="Redo (Ctrl+Shift+Z)">&#8631;</button>
  <div class="sep"></div>
  <select id="paper" title="Paper size">
    <option value="a4">A4</option>
    <option value="letter">US Letter</option>
  </select>
  <div class="spacer"></div>
  <button id="panelBtn" class="icon ghost" aria-expanded="false" aria-controls="side" title="Show or hide the settings panel" aria-label="Show or hide the settings panel">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
      <path d="M1.5 4.5h13M1.5 8h13M1.5 11.5h13"/>
      <circle cx="5.5" cy="4.5" r="1.6" fill="var(--bg2)"/>
      <circle cx="10.5" cy="8" r="1.6" fill="var(--bg2)"/>
      <circle cx="4.5" cy="11.5" r="1.6" fill="var(--bg2)"/>
    </svg>
  </button>
  <button id="helpBtn" class="ghost" aria-pressed="false" title="Show or hide help">?<span class="btn-label"> Help</span></button>
  <button id="openZine" class="icon ghost" title="Open a .zine file" aria-label="Open a .zine file">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round">
      <path d="M2 5.2V3.6a1 1 0 0 1 1-1h2.9l1.2 1.4H13a1 1 0 0 1 1 1V6"/>
      <path d="M2 5.6h11.6a1 1 0 0 1 .97 1.24l-1.2 4.8a1 1 0 0 1-.97.76H3.6a1 1 0 0 1-.97-.76l-1.2-4.8A1 1 0 0 1 2 5.6z"/>
    </svg>
    <span class="mobile-label">Open</span>
  </button>
  <button id="saveZine" class="icon ghost" title="Save an editable .zine file" aria-label="Save an editable .zine file">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round">
      <path d="M3 2.5h7.6l2.9 2.9V13a.5.5 0 0 1-.5.5h-9.5A.5.5 0 0 1 3 13v-10a.5.5 0 0 1 .5-.5z"/>
      <path d="M5.2 2.5v3.2h4.6V2.5"/>
      <path d="M4.7 9.3h6.6v4.2H4.7z"/>
    </svg>
    <span class="mobile-label">Save</span>
  </button>
  <div class="sep"></div>
  <div class="split">
    <button id="exportPdf" class="primary"><span class="btn-label">Export </span>PDF</button>
    <button id="exportMenuBtn" class="primary icon split-arrow" aria-haspopup="true" aria-expanded="false" title="More export options" aria-label="More export options">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6l4 4 4-4"/></svg>
    </button>
    <div class="menu" id="exportMenu" role="menu" hidden>
      <button id="exportPng" role="menuitem">Export PNG</button>
    </div>
  </div>
</div>

<div class="stage" id="stage">
  <div class="paper-wrap">
    <div class="sheet-labels" id="sheetLabels"></div>
    <div class="sheet-box" id="sheetBox">
      <div class="sheet" id="sheet"></div>
      <div class="spine" id="spine"></div>
    </div>
  </div>
  <div class="strip" id="strip"></div>
  <div class="drop-hint">drop images here</div>
</div>

<aside class="side" id="side">
  <!-- Grip and close button for when this is a sheet over the stage. -->
  <div class="side-bar">
    <span class="grab" aria-hidden="true"></span>
    <button id="sideClose" class="icon ghost" title="Close the settings panel" aria-label="Close the settings panel">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg>
    </button>
  </div>
  <!-- The title, paper size and file buttons park here on a phone, moved out
       of the toolbar by app.js — see MOBILE_SETTINGS. Empty and hidden on a
       wide screen, where those controls stay in the toolbar. -->
  <div class="grp" id="docSettings" hidden>
    <div class="side-section">Document</div>
    <div class="row">
      <label class="f" style="margin:0;flex:none;width:40px">Title</label>
      <span class="grow" id="slotTitle"></span>
    </div>
    <div class="row">
      <label class="f" style="margin:0;flex:none;width:40px">Paper</label>
      <span class="grow" id="slotPaper"></span>
    </div>
    <div class="row">
      <span class="grow" id="slotOpen"></span>
      <span class="grow" id="slotSave"></span>
    </div>
  </div>
  <!-- Explanatory text lives here, hidden until the Help button is pressed. -->
  <div id="help" class="help" hidden></div>
  <div id="inspector"></div>
</aside>
<div class="toast" id="toast"></div>

<script src="qr.js"></script>
<script src="app.js"></script>
</body>
</html>
